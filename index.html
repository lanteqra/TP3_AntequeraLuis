<!DOCTYPE html>
<html lang="fr-ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Site non-officiel dédié à l'écrivain Brandon Sanderson et à son univers du Cosmere.">
    <title>Accueil | La Forge des Mots — Brandon Sanderson</title>

    <link rel="manifest" href="manifest.json">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.0/jquery.min.js"
        integrity="sha256-xNzN2a4ltkB44Mc/Jz3pT4iU1cmeR0FkXs4pru/JxaQ=" crossorigin="anonymous" defer></script>
    <script src="js/navbar.js" defer></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/material-design-icons/3.0.1/iconfont/material-icons.min.css"
        integrity="sha256-x8PYmLKD83R9T/sYmJn1j3is/chhJdySyhet/JuHnfY=" crossorigin="anonymous" defer>

    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

    <!-- Style Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <style type="text/tailwindcss">
        @theme {
        /* Palette */
            --color-abyss: #0d1117;
            --color-abyss-light: #3e506b;
            --color-slate-card: #1c2129;
            --color-ember: #c77b3f;
            --color-ember-light: #f0b562;
            --color-ember-dark: #8a5326;
            --color-storm: #4a7fb5;
            --color-storm-light: #7ba7d9;
            --color-parchment: #e8e3d3;
            --color-parchment-dim: #a8a396;

        /* Typographies */
            --font-display: "Cormorant Garamond", serif;
            --font-body: "Inter", sans-serif;
            --font-mono: "JetBrains Mono", monospace;
        }

        .focus-visible {
            @apply focus-visible:outline-2 focus-visible:outline-ember focus-visible:outline-offset-2;
        }

        .footer__social-item, .footer__link {
            @apply text-ember-light hover:text-ember-dark transition-colors duration-200;
        }

    </style>
    <link rel="icon" href="favicon-48x48.ico">
</head>

<body class="font-body">
    <!-- Accessibilité -->
    <a href="#content" class="sr-only">Aller au contenu principal</a>
    <header>
        <!-- navbar -->
        <div
            class="navbar__container grid grid-cols-12 gap-1 text-center border-b-4 border-white/5 sticky top-0 z-50 backdrop-blur">
            <!-- component -->
            <nav class="navbar col-span-12 flex items-center bg-abyss p-3 flex-wrap">
                <!-- logo -->
                <a href="index.html" class="navbar__brand p-2 mr-4 inline-flex items-center focus-visible"
                    aria-label="Retour à l'accueil - La Forge des Mots">
                    <img src="media/logo-icons/icon-andr-192x192.png" alt="logo du site web du La Forge des Mots"
                        aria-hidden="true" class="navbar__logo w-20 h-20 rounded-full m-2 border-4 border-abyss-light">
                    <span
                        class="navbar__title font-titre text-2xl font-bold tracking-wide text-parchment hover:text-ember-light font-display">La
                        Forge des Mots</span>
                </a>

                <button
                    class="navbar__toggle text-parchment inline-flex p-4 hover:bg-parchment/25 rounded lg:hidden ml-auto hover:text-ember-light nav-toggler focus-visible"
                    data-target="#navigation" aria-expanded="false">
                    <i class="material-icons text-4xl!" aria-hidden="true">menu</i>
                </button>
                <div class="navbar__menu hidden top-navbar w-full lg:inline-flex lg:grow lg:w-auto" id="navigation">
                    <div
                        class=" navbar__list md:inline-flex md:flex-row md:ml-auto md:w-auto w-full md:items-center items-start  flex flex-col md:h-auto pr-5 gap-3.5 text-[1.2rem]">
                        <a href="index.html"
                            class="navbar__link navbar__link--active md:inline-flex md:w-auto w-full px-3 py-2 rounded text-abyss font-bold items-center justify-center bg-storm hover:bg-parchment hover:text-storm uppercase transition-colors focus-visible">
                            <span>Accueil</span>
                        </a>
                        <a href="auteurInfo.html"
                            class="navbar__link md:inline-flex md:w-auto w-full px-3 py-2 rounded text-parchment font-extrabold items-center justify-center bg-abyss-light hover:bg-storm transition-colors hover:text-orange-horizon focus-visible">
                            <span>L'Auteur</span>
                        </a>
                        <a href="oeuvresInfo.html"
                            class="navbar__link md:inline-flex md:w-auto w-full px-3 py-2 rounded text-parchment font-extrabold items-center justify-center bg-abyss-light hover:bg-storm transition-colors hover:text-orange-horizon focus-visible">
                            <span>Les œuvres</span>
                        </a>
                        <a href="communauté.html"
                            class="navbar__link md:inline-flex md:w-auto w-full px-3 py-2 rounded text-parchment font-extrabold items-center justify-center bg-abyss-light hover:bg-storm transition-colors hover:text-orange-horizon focus-visible">
                            <span>Communauté</span>
                        </a>


                    </div>
                </div>
            </nav>
        </div>
    </header>
    <main id="content">

    </main>
    <footer class="footer bg-abyss text-parchment text-base border-t-4 border-parchment">
        <div class="footer__container container mx-auto px-4 py-8">
            <div class="footer__grid grid grid-cols-12 gap-4 items-center">

                <!-- top left -->
                <div
                    class="footer__top-left col-span-12 sm:col-span-6 flex flex-row items-center gap-2 justify-center sm:justify-start">
                    <address
                        class="footer__address flex flex-col md:flex-row gap-4 text-center sm:text-left">
                        <a href="tel:819-123-4567" class="footer__link focus-visible flex items-center">
                            <box-icon name='phone' type='solid' color='currentColor' size='md' aria-hidden="true"></box-icon> 819-123-4567
                        </a>
                        <a href="mailto:info@laforge-mots.com" class="footer__link focus-visible flex items-center focus-visible">
                            <box-icon name='envelope' type='solid' color='currentColor' size='md' aria-hidden="true"></box-icon>
                            info@laforge-mots.com
                        </a>
                    </address>
                </div>

                <!-- top right -->
                <div
                    class="footer__top-right col-span-12 sm:col-span-6 flex flex-col md:flex-row items-center sm:items-end md:items-center justify-center md:justify-end gap-5 text-center sm:text-right">
                    <p class="footer__names">
                        <span class="footer__names--accent font-bold">
                            Site integré par : </span><br>Luis Antequera
                    </p>

                    <ul class="footer__social-list flex gap-4">
                        <li class="footer__social-item">
                            <a class="footer__social-link" href="https://www.facebook.com/" aria-label="Facebook"
                                target="_blank" rel="noopener noreferrer">
                                <box-icon type='logo' name='facebook-circle' color='currentColor' size='md'
                                    aria-hidden="true"></box-icon>
                            </a>
                        </li>
                        <li class="footer__social-item">
                            <a class="footer__social-link" href="https://www.linkedin.com/" aria-label="Linkedin"
                                target="_blank" rel="noopener noreferrer">
                                <box-icon type='logo' name='linkedin' size='md' color='currentColor'
                                    aria-hidden="true"></box-icon>
                            </a>
                        </li>
                        <li class="footer__social-item">
                            <a class="footer__social-link" href="https://x.com/" aria-label="X (Twitter)" target="_blank"
                                rel="noopener noreferrer">
                                <box-icon type='logo' name='twitter' color='currentColor' size='md'
                                    aria-hidden="true"></box-icon>
                            </a>
                        </li>
                        <li class="footer__social-item">
                            <a class="footer__social-link" href="https://www.instagram.com/" aria-label="Instagram"
                                target="_blank" rel="noopener noreferrer">
                                <box-icon type='logo' name='instagram-alt' color='currentColor' size='md'></box-icon>
                            </a>
                        </li>
                    </ul>


                </div>

                <!-- bottom -->
                <div
                    class="footer__bottom col-span-12 flex flex-col justify-center text-center sm:text-left items-center md:items-baseline gap-1 py-4 mt-4 border-t-4 border-beige-terre/50">
                    <p class="footer__cegep">
                        <span class="footer__cegep--accent font-bold">Dans le cadre de :</span>
                        Techniques d'integration des interfaces Web 1
                        <br>Cégep de Trois-Rivières
                    </p>
                </div>

            </div>
        </div>
    </footer>

    <!--Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('service-worker.js')
                    .then((reg) => {
                        console.log('SW enregistré', reg);
                    });
            });
        }
    </script>
</body>

</html>
